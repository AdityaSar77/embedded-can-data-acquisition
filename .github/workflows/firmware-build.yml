name: Firmware build

on: 
    push:
        branches: [main]
    
    pull_request:
        branches: [main]
    
jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            
            - name: Inspect project files
              shell: pwsh
              run: |
                Get-ChildItem -Force
                Test-Path .project
                Test-Path .cproject